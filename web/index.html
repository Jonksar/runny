<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>runny</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: #0b0d10; color: #e8ecf1;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header { padding: 20px 0 8px; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #a3adbb; font-weight: 600; }
  #state {
    margin-top: 6px; font-size: 34px; font-weight: 700; letter-spacing: -.02em;
  }
  .idle { color: #a3adbb; } .listening { color: #4ade80; }
  .thinking { color: #fbbf24; } .speaking { color: #60a5fa; } .error { color: #f87171; }
  #log {
    flex: 1; overflow-y: auto; margin: 16px 0; display: flex;
    flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch;
  }
  .line { font-size: 21px; line-height: 1.35; }
  .line.user { color: #9aa4b2; }
  .line.agent { color: #e8ecf1; }
  .line.sys { color: #f87171; font-size: 15px; }
  #go {
    width: 100%; min-height: 88px; border: 0; border-radius: 12px;
    background: #2563eb; color: #fff; font-size: 22px; font-weight: 650;
    margin-bottom: 14px; -webkit-tap-highlight-color: transparent;
  }
  #go:disabled { background: #1f2937; color: #a3adbb; }
  #go.stop { background: #b91c1c; }
  #go:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  header p { color: #a3adbb; }
  .line { overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>runny</h1>
  <div id="state" class="idle" role="status">Ready to connect</div>
  <p>Use headphones. Keep this page open while talking.</p>
</header>
<div id="log" role="log" aria-label="Conversation"></div>
<button id="go">Start</button>

<audio id="audio" autoplay playsinline></audio>
<script type="module" src="client.js"></script>
</body>
</html>
